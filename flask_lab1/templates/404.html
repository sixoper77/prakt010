{% extends "base.html" %}
{% block title %}404 — Не знайдено{% endblock %}

{% block content %}
<div class="error-page">
    <div class="code">404</div>
    <h2>{{ message or 'Сторінку не знайдено' }}</h2>
    <p>Перевірте адресу або поверніться на головну.</p>
    <a href="{{ url_for('index') }}" class="btn">На головну</a>
    &nbsp;
    <a href="{{ url_for('catalog') }}" class="btn btn-outline">Каталог</a>
</div>
{% endblock %}
