<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %} | Електроніка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <a href="{{ url_for('index') }}" class="logo">Електроніка</a>
    <a href="{{ url_for('index') }}">Головна</a>
    <a href="{{ url_for('catalog') }}">Каталог</a>
    <a href="{{ url_for('about') }}">Про нас</a>
    <form action="{{ url_for('search') }}" method="get">
        <input type="text" name="q" placeholder="Пошук...">
        <button type="submit">Знайти</button>
    </form>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    &copy; 2026 Електроніка
</footer>

</body>
</html>
